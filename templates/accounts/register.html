{% extends "base.html" %}

{% block title %}
Register | CarbonIQ
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">
        <div class="card shadow-sm auth-card carbon-section-green">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="auth-icon auth-icon-green mb-3">
                        <i class="bi bi-person-plus"></i>
                    </div>

                    <h2 class="fw-bold mb-1">
                        Create Your CarbonIQ Account
                    </h2>

                    <p class="text-muted mb-0">
                        Start tracking your carbon footprint
                    </p>
                </div>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success w-100 auth-submit-btn">

                        <i class="bi bi-person-plus me-1"></i>
                        Create Account

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
