{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h2>{{ request.user.full_name }}</h2>

                <p class="text-muted">

                    {{ request.user.email }}

                </p>

                <hr>

                <p>
                    Welcome to CarbonIQ.
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
