{% extends "base.html" %}

{% block title %}
Login | CarbonIQ
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">
        <div class="card shadow-sm auth-card carbon-section-purple">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="auth-icon auth-icon-purple mb-3">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>

                    <h2 class="fw-bold mb-1">
                        Welcome Back
                    </h2>

                    <p class="text-muted mb-0">
                        Sign in to continue to CarbonIQ
                    </p>
                </div>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        class="btn btn-primary w-100 auth-submit-btn"
                        type="submit">

                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
